<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Omnia — Asistent normative</title>
    <style>
        body {
            font-family: Georgia, serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f0;
            color: #222;
        }
        h1 { font-size: 1.4em; }
        textarea {
            width: 100%;
            height: 80px;
            font-size: 1em;
            font-family: inherit;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
        button:disabled { cursor: wait; opacity: 0.6; }
        #raspuns {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Omnia — Asistent normative</h1>
    <p>Întreabă ceva despre documentele normative încărcate. Fiecare răspuns e citat exact din sursă.</p>

    <textarea id="intrebare" placeholder="Ex: Cum sunt clasificate starile limita?"></textarea>
    <br>
    <button id="buton">Întreabă</button>

    <div id="raspuns"></div>

    <script>
        // Prindem referinte catre elementele din pagina, ca sa le putem citi/modifica din JavaScript
        const buton = document.getElementById("buton");
        const campIntrebare = document.getElementById("intrebare");
        const zonaRaspuns = document.getElementById("raspuns");

        // "addEventListener" spune browserului: cand cineva apasa butonul (eveniment "click"),
        // ruleaza functia async de mai jos. "async" ii permite functiei sa foloseasca "await",
        // adica sa astepte raspunsul serverului fara sa "inghete" pagina.
        buton.addEventListener("click", async () => {
            const intrebare = campIntrebare.value.trim();
            if (!intrebare) return;

            buton.disabled = true;
            zonaRaspuns.textContent = "Se cauta raspunsul...";

            try {
                // fetch() trimite o cerere HTTP catre server, din browser, fara sa reincarci pagina.
                // Corespunde exact endpoint-ului definit in main.py: @app.post("/intreaba")
                const raspunsServer = await fetch("/intreaba", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ intrebare: intrebare })
                });

                const date = await raspunsServer.json();
                zonaRaspuns.textContent = date.raspuns;
            } catch (eroare) {
                zonaRaspuns.textContent = "Eroare la conectarea cu serverul: " + eroare;
            } finally {
                buton.disabled = false;
            }
        });
    </script>
</body>
</html>
